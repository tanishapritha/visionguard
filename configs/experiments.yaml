    brightness: [-40, -20, 20, 40]
    gaussian_noise: [5, 15, 30]
    blur: [1, 2, 4]
    contrast: [0.7, 0.85, 1.15, 1.3]
evaluation:
  bootstrap_samples: 1000
  random_seed: 42
routing:
  drift_threshold: 0.70
  uncertainty_threshold: 0.55
