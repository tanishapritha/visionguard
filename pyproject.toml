[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "visionguard"
version = "0.1.0"
description = "Evidence-grounded, drift-aware video intelligence research prototype"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26","scipy>=1.11","scikit-learn>=1.4","pydantic>=2.6","pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0","ruff>=0.6"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
