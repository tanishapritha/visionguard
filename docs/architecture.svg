<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720">
<rect width="1600" height="720" fill="#ffffff"/>
<style>
.title{font:700 28px Arial,sans-serif;fill:#111827}.h{font:700 20px Arial,sans-serif;fill:#111827}.t{font:400 16px Arial,sans-serif;fill:#374151}.small{font:600 15px Arial,sans-serif}.box{stroke:#d1d5db;stroke-width:2}.arrow{stroke:#374151;stroke-width:3;fill:none;marker-end:url(#a)}.green{stroke:#3f7d4a;fill:none;stroke-width:3;marker-end:url(#ag)}.red{stroke:#b34a5a;fill:none;stroke-width:3;marker-end:url(#ar)}
</style>
<defs>
<marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 z" fill="#374151"/></marker>
<marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 z" fill="#3f7d4a"/></marker>
<marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 z" fill="#b34a5a"/></marker>
</defs>
<text x="800" y="45" text-anchor="middle" class="title">VisionGuard — Drift-aware Video Intelligence</text>

<rect x="35" y="235" width="175" height="170" rx="16" fill="#f8fafc" class="box"/>
<text x="122" y="270" text-anchor="middle" class="h">Video Stream</text>
<rect x="65" y="292" width="115" height="25" fill="#e5e7eb"/><rect x="65" y="327" width="115" height="25" fill="#e5e7eb"/><rect x="65" y="362" width="115" height="25" fill="#e5e7eb"/>
<text x="122" y="390" text-anchor="middle" class="t">…</text>

<rect x="250" y="215" width="220" height="210" rx="16" fill="#eef7ff" class="box"/>
<text x="360" y="255" text-anchor="middle" class="h">CV Model</text>
<circle cx="360" cy="315" r="28" fill="none" stroke="#111827" stroke-width="3"/><circle cx="325" cy="350" r="12" fill="none" stroke="#111827" stroke-width="3"/><circle cx="395" cy="350" r="12" fill="none" stroke="#111827" stroke-width="3"/><line x1="340" y1="333" x2="328" y2="343" stroke="#111827" stroke-width="3"/><line x1="380" y1="333" x2="392" y2="343" stroke="#111827" stroke-width="3"/>
<text x="360" y="390" text-anchor="middle" class="t">Detection · Tracking · Embeddings</text>

<rect x="505" y="185" width="260" height="270" rx="16" fill="#f1f8f1" class="box"/>
<text x="635" y="225" text-anchor="middle" class="h">Drift &amp; Uncertainty</text><text x="635" y="250" text-anchor="middle" class="h">Monitoring</text>
<text x="635" y="305" text-anchor="middle" class="t">Feature drift</text><text x="635" y="335" text-anchor="middle" class="t">Confidence shift</text><text x="635" y="365" text-anchor="middle" class="t">Output distribution</text><text x="635" y="395" text-anchor="middle" class="t">Uncertainty</text>

<rect x="800" y="260" width="150" height="120" rx="16" fill="#f8fafc" class="box"/>
<text x="875" y="310" text-anchor="middle" class="h">Router</text><path d="M875 325 l-25 30 M875 325 l25 30 M875 325 l0 -30" stroke="#111827" stroke-width="3" fill="none"/>

<rect x="1030" y="110" width="220" height="140" rx="16" fill="#f2faf2" class="box"/>
<text x="1140" y="155" text-anchor="middle" class="h">Continue CV</text><text x="1140" y="195" text-anchor="middle" class="t">Use model outputs</text>

<rect x="1030" y="410" width="220" height="170" rx="16" fill="#fff1f3" class="box"/>
<text x="1140" y="455" text-anchor="middle" class="h">Video VLM</text><text x="1140" y="482" text-anchor="middle" class="h">Investigation</text><text x="1140" y="530" text-anchor="middle" class="t">Analyze suspicious events</text>

<rect x="1290" y="410" width="220" height="170" rx="16" fill="#fff1f3" class="box"/>
<text x="1400" y="455" text-anchor="middle" class="h">Evidence</text><text x="1400" y="482" text-anchor="middle" class="h">Grounding</text><text x="1400" y="530" text-anchor="middle" class="t">Link claims to frames</text>

<rect x="1290" y="110" width="220" height="140" rx="16" fill="#f2faf2" class="box"/>
<text x="1400" y="155" text-anchor="middle" class="h">Normal</text><text x="1400" y="195" text-anchor="middle" class="t">Continue inference</text>

<rect x="1540" y="410" width="0" height="0"/>
<line x1="210" y1="320" x2="250" y2="320" class="arrow"/>
<line x1="470" y1="320" x2="505" y2="320" class="arrow"/>
<line x1="765" y1="320" x2="800" y2="320" class="arrow"/>
<path d="M950 300 L990 300 L990 180 L1030 180" class="green"/>
<path d="M950 340 L990 340 L990 495 L1030 495" class="red"/>
<line x1="1250" y1="495" x2="1290" y2="495" class="arrow"/>

<text x="995" y="165" class="small" fill="#3f7d4a">NORMAL</text>
<text x="995" y="480" class="small" fill="#b34a5a">DRIFT / UNCERTAIN</text>
</svg>